<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <p class="brand">Yapılacaklar</p>
      <h1>Bugün ne yapılacak?</h1>
      <p class="subtitle">Görevlerini ekle, tamamla, sil — tarayıcında saklanır.</p>
    </header>

    <form class="add-form" id="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">Yeni görev</label>
      <input
        type="text"
        id="todo-input"
        name="todo"
        placeholder="Yeni görev yaz…"
        maxlength="200"
        required
      />
      <button type="submit">Ekle</button>
    </form>

    <p class="meta" id="todo-meta" hidden></p>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

    <p class="empty" id="empty-state">Henüz görev yok. Yukarıdan ekleyebilirsin.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
