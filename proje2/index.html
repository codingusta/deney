<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapılacaklar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <p class="brand">Yapılacaklar</p>
      <h1>Bugün ne yapılacak?</h1>
      <p class="subtitle">Ekle, tamamla, çift tıkla düzenle. Veriler tarayıcıda kalır.</p>
    </header>

    <form class="add-form" id="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">Yeni görev</label>
      <input
        type="text"
        id="todo-input"
        name="todo"
        placeholder="Yeni görev yaz, Enter ile ekle…"
        maxlength="200"
        required
      />
      <label class="sr-only" for="todo-priority">Görev önceliği</label>
      <select id="todo-priority" name="priority" aria-label="Görev önceliği">
        <option value="low">Düşük öncelik</option>
        <option value="medium" selected>Orta öncelik</option>
        <option value="high">Yüksek öncelik</option>
      </select>
      <button type="submit">Ekle</button>
    </form>

    <section class="toolbar" aria-label="Liste araçları">
      <p class="counter" id="todo-counter">0 görev kaldı</p>
      <div class="filters" role="tablist" aria-label="Görev filtresi">
        <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">Hepsi</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Aktif</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Tamamlanan</button>
      </div>
      <button type="button" class="clear-btn" id="clear-completed" disabled>
        Tamamlananları temizle
      </button>
    </section>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
    <p class="empty" id="empty-state">Henüz görev yok. Yukarıdan ekleyebilirsin.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
